<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<title>Premier Palette</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body{margin:0;padding:24px;background:var(--premier-cream);font-family:var(--font-sans);}
  .row{display:flex;gap:14px;align-items:stretch;}
  .sw{flex:1;border-radius:var(--radius-md);padding:14px;height:120px;display:flex;flex-direction:column;justify-content:space-between;}
  .sw .nm{font-weight:700;font-size:13px;}
  .sw .hex{font-family:var(--font-mono);font-size:11px;opacity:0.9;}
  .sample{flex:1.4;background:var(--premier-cream);border:1px solid #e6dcc1;display:flex;align-items:center;justify-content:center;}
  .sample img{height:36px;}
</style></head>
<body>
<div class="row">
  <div class="sw" style="background:#b18a3a;color:#fff"><div class="nm">Premier Gold</div><div class="hex">#B18A3A</div></div>
  <div class="sw" style="background:#c9a35a;color:#fff"><div class="nm">Premier Gold Soft</div><div class="hex">#C9A35A</div></div>
  <div class="sw" style="background:#faf6ec;color:#5a4a1d;border:1px solid #ecdfb8"><div class="nm">Premier Cream</div><div class="hex">#FAF6EC</div></div>
  <div class="sample"><img src="../assets/logo-shinhan-premier.png" alt="Shinhan Premier"/></div>
</div>
</body></html>
