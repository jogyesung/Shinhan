<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<title>Primary Colors</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body{margin:0;padding:24px;background:var(--bg1);font-family:var(--font-sans);}
  .row{display:flex;gap:14px;}
  .sw{flex:1;border-radius:var(--radius-md);padding:16px;height:120px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow-sm);}
  .sw .nm{font-weight:700;font-size:14px;letter-spacing:-0.005em;}
  .sw .hex{font-family:var(--font-mono);font-size:12px;opacity:0.85;}
  .sw .pan{font-size:11px;opacity:0.7;margin-top:2px;}
  .lbl-w{color:#fff;}
  .lbl-d{color:var(--fg1);}
</style></head>
<body>
<div class="row">
  <div class="sw" style="background:#0046ff"><div class="lbl-w"><div class="nm">Shinhan Blue</div><div class="pan">Pantone 2388 C — primary</div></div><div class="lbl-w hex">#0046FF</div></div>
  <div class="sw" style="background:#0023b3"><div class="lbl-w"><div class="nm">Shinhan Blue Deep</div><div class="pan">Heading / section title</div></div><div class="lbl-w hex">#0023B3</div></div>
  <div class="sw" style="background:#000"><div class="lbl-w"><div class="nm">Black</div><div class="pan">CMYK 0/0/0/100</div></div><div class="lbl-w hex">#000000</div></div>
  <div class="sw" style="background:#fff;border:1px solid var(--line)"><div class="lbl-d"><div class="nm">White</div><div class="pan">Surfaces, paper</div></div><div class="lbl-d hex">#FFFFFF</div></div>
</div>
</body></html>
