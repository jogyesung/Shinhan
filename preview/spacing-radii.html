<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);}
.row{display:flex;gap:12px;align-items:flex-end;}
.box{background:var(--bg2);border:1px solid var(--line);width:80px;height:80px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-family:var(--font-mono);font-size:11px;color:var(--fg3);}
.lbl{font-size:11px;color:var(--fg2);margin-top:6px;text-align:center;font-family:var(--font-mono);}
.cell{display:flex;flex-direction:column;align-items:center;}
</style></head>
<body>
<div class="row">
  <div class="cell"><div class="box" style="border-radius:4px">4</div><div class="lbl">--radius-xs</div></div>
  <div class="cell"><div class="box" style="border-radius:8px">8</div><div class="lbl">--radius-sm</div></div>
  <div class="cell"><div class="box" style="border-radius:12px">12</div><div class="lbl">--radius-md</div></div>
  <div class="cell"><div class="box" style="border-radius:16px">16</div><div class="lbl">--radius-lg</div></div>
  <div class="cell"><div class="box" style="border-radius:20px">20</div><div class="lbl">--radius-xl</div></div>
  <div class="cell"><div class="box" style="border-radius:24px">24</div><div class="lbl">--radius-2xl</div></div>
  <div class="cell"><div class="box" style="border-radius:9999px;width:140px">pill</div><div class="lbl">--radius-pill</div></div>
</div>
</body></html>
