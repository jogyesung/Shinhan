<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<title>Logo lockups</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:center;}
.cell{background:var(--bg2);border-radius:12px;padding:18px;height:90px;display:flex;align-items:center;justify-content:center;}
.cream{background:var(--premier-cream);}
.dark{background:var(--shinhan-blue);}
.cell img{max-height:48px;max-width:100%;}
</style></head>
<body>
<div class="cell"><img src="../assets/logo-shinhan-securities.png" alt="Shinhan Securities"/></div>
<div class="cell cream"><img src="../assets/logo-shinhan-premier.png" alt="Shinhan Premier"/></div>
</body></html>
