<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/>
<title>Type — Display</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>body{margin:0;padding:22px 28px;background:#fff;font-family:var(--font-sans);}

<body>
<div class="meta">DISPLAY · OneShinhan Bold · 700</div>
<div class="spec kr">신한금융그룹</div>
