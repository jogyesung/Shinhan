<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<title>Secondary Blues</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body{margin:0;padding:24px;background:var(--bg1);font-family:var(--font-sans);}
  .row{display:flex;gap:12px;}
  .sw{flex:1;border-radius:var(--radius-md);padding:14px;height:120px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow-sm);}
  .sw .nm{font-weight:700;font-size:13px;}
  .sw .pan{font-size:11px;opacity:0.75;margin-top:2px;}
  .sw .hex{font-family:var(--font-mono);font-size:11px;opacity:0.85;}
</style></head>
<body>
<div class="row">
  <div class="sw" style="background:#8cd2f5;color:#0f1426"><div><div class="nm">Light Blue</div><div class="pan">Pantone 2905 C</div></div><div class="hex">#8CD2F5</div></div>
  <div class="sw" style="background:#4baff5;color:#0f1426"><div><div class="nm">Sky Blue</div><div class="pan">Pantone 298 C</div></div><div class="hex">#4BAFF5</div></div>
  <div class="sw" style="background:#2878f5;color:#fff"><div><div class="nm">Royal Blue</div><div class="pan">Pantone 2727 C</div></div><div class="hex">#2878F5</div></div>
  <div class="sw" style="background:#00236e;color:#fff"><div><div class="nm">Navy Blue</div><div class="pan">Pantone 288 C</div></div><div class="hex">#00236E</div></div>
</div>
</body></html>
