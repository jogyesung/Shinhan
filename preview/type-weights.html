<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/>
<title>Type — Weight ladder</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>body{margin:0;padding:24px 28px;background:#fff;font-family:var(--font-sans);}
.row{display:flex;align-items:baseline;gap:20px;padding:8px 0;}
.tag{width:130px;font-family:var(--font-mono);font-size:11px;color:var(--fg3);}
.spec{font-size:32px;color:var(--fg1);letter-spacing:-0.01em;}
</style></head>
<body>
<div class="row"><div class="tag">300 · Light</div><div class="spec" style="font-weight:300;">슈퍼SOL Premier</div></div>
<div class="row"><div class="tag">400 · Regular</div><div class="spec" style="font-weight:400;">슈퍼SOL Premier</div></div>
<div class="row"><div class="tag">500 · Medium</div><div class="spec" style="font-weight:500;">슈퍼SOL Premier</div></div>
<div class="row"><div class="tag">700 · Bold</div><div class="spec" style="font-weight:700;">슈퍼SOL Premier</div></div>
</body></html>
