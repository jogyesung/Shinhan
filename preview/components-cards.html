<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/>
<title>Card</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>body{margin:0;padding:24px;background:var(--bg2);font-family:var(--font-sans);}
.card{background:#fff;border-radius:20px;padding:18px 20px;box-shadow:var(--shadow-sm);}
.card+.card{margin-top:10px;}
.row{display:flex;justify-content:space-between;align-items:center;}
.k{font-size:14px;color:var(--fg2);font-weight:500;}
.v{font-family:var(--font-mono);font-size:18px;font-weight:700;color:var(--fg1);letter-spacing:-0.01em;}
.sub{font-size:12px;color:var(--fg3);margin-top:4px;}
.chip{font-size:11px;padding:3px 8px;border-radius:6px;background:#eef4ff;color:var(--shinhan-blue);font-weight:700;}
</style></head>
<body>
<div class="card"><div class="row"><div><div class="k">자산</div><div class="sub">지난달 대비 +1% 증가</div></div><div class="v">110,353,390원</div></div></div>
<div class="card"><div class="row"><div><div class="k">소비</div><div class="sub">2025.04.01 · 15:30</div></div><div class="v">20,311,501원</div></div></div>
<div class="card"><div class="row"><div><div class="k">주식 <span class="chip">+234%</span></div><div class="sub">+1,231,541,515원</div></div><div class="v" style="color:var(--positive)">20,311,501원</div></div></div>
</body></html>
