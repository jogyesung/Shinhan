<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/>
<title>Bottom nav</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>body{margin:0;padding:0;background:#f5f7fb;font-family:var(--font-sans);}
.nav{display:grid;grid-template-columns:repeat(5,1fr);background:#fff;padding:10px 4px 16px;border-top:1px solid var(--line);}
.t{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--fg3);font-weight:500;}
.t.active{color:var(--shinhan-blue);font-weight:700;}
.ic{width:26px;height:26px;border-radius:6px;background:var(--bg3);}
.t.active .ic{background:var(--shinhan-blue);}
</style></head>
<body>
<div class="nav">
  <div class="t active"><div class="ic"></div>홈</div>
  <div class="t"><div class="ic"></div>금융</div>
  <div class="t"><div class="ic"></div>상품</div>
  <div class="t"><div class="ic"></div>혜택</div>
  <div class="t"><div class="ic"></div>주식</div>
</div>
</body></html>
