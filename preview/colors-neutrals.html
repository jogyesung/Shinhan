<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<title>Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body{margin:0;padding:24px;background:var(--bg1);font-family:var(--font-sans);}
  .row{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
  .sw{border-radius:var(--radius-sm);padding:10px;height:96px;display:flex;flex-direction:column;justify-content:space-between;}
  .sw .nm{font-weight:700;font-size:12px;}
  .sw .hex{font-family:var(--font-mono);font-size:10px;opacity:0.85;}
</style></head>
<body>
<div class="row">
  <div class="sw" style="background:#0f1426;color:#fff"><div class="nm">fg1</div><div class="hex">#0F1426</div></div>
  <div class="sw" style="background:#2b3243;color:#fff"><div class="nm">fg2</div><div class="hex">#2B3243</div></div>
  <div class="sw" style="background:#5a6376;color:#fff"><div class="nm">fg3</div><div class="hex">#5A6376</div></div>
  <div class="sw" style="background:#8a92a3;color:#fff"><div class="nm">fg4</div><div class="hex">#8A92A3</div></div>
  <div class="sw" style="background:#eef1f7;color:#0f1426"><div class="nm">bg3</div><div class="hex">#EEF1F7</div></div>
  <div class="sw" style="background:#f5f7fb;color:#0f1426"><div class="nm">bg2</div><div class="hex">#F5F7FB</div></div>
  <div class="sw" style="background:#fff;color:#0f1426;border:1px solid var(--line)"><div class="nm">bg1</div><div class="hex">#FFFFFF</div></div>
</div>
</body></html>
