<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>body{margin:0;padding:20px 28px;background:#fff;font-family:var(--font-sans);}
.row{display:flex;align-items:center;gap:14px;padding:5px 0;}
.tag{width:80px;font-family:var(--font-mono);font-size:11px;color:var(--fg3);}
.bar{height:14px;background:var(--shinhan-blue);border-radius:3px;}
.val{font-family:var(--font-mono);font-size:11px;color:var(--fg2);}
</style></head>
<body>
<div class="row"><div class="tag">--s-1</div><div class="bar" style="width:4px"></div><div class="val">4 px</div></div>
<div class="row"><div class="tag">--s-2</div><div class="bar" style="width:8px"></div><div class="val">8 px</div></div>
<div class="row"><div class="tag">--s-3</div><div class="bar" style="width:12px"></div><div class="val">12 px</div></div>
<div class="row"><div class="tag">--s-4</div><div class="bar" style="width:16px"></div><div class="val">16 px</div></div>
<div class="row"><div class="tag">--s-5</div><div class="bar" style="width:20px"></div><div class="val">20 px</div></div>
<div class="row"><div class="tag">--s-6</div><div class="bar" style="width:24px"></div><div class="val">24 px</div></div>
<div class="row"><div class="tag">--s-8</div><div class="bar" style="width:32px"></div><div class="val">32 px</div></div>
<div class="row"><div class="tag">--s-12</div><div class="bar" style="width:48px"></div><div class="val">48 px</div></div>
<div class="row"><div class="tag">--s-16</div><div class="bar" style="width:64px"></div><div class="val">64 px</div></div>
</body></html>
